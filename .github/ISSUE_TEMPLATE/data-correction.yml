name: 치과 공개정보 정정 요청
description: 사이트의 기관 정보와 공개 근거가 다른 경우 알려주세요.
title: '[정보 정정] '
body:
  - type: markdown
    attributes:
      value: |
        이 제보는 공개 게시글입니다. 환자 이름·연락처·증상·진료기록·예약 내용 등 개인정보를 쓰지 마세요.
        의료상담이나 긴급 연락을 받는 창구가 아닙니다. 공개된 기관 정보와 근거 URL만 제출해 주세요.
  - type: input
    id: clinic
    attributes:
      label: 기관명 또는 사이트 페이지 주소
      placeholder: https://dentaldatalab.com/clinics/...
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 정정할 항목
      options:
        - 기관명·종별·주소·전화
        - 홈페이지·온라인 채널
        - 진료시간
        - 등록 인력·장비
        - 통계·출처·표시 방식
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: 현재 표시와 확인할 내용
      description: 공개된 기관 정보만 설명해 주세요. 연락처나 건강정보를 적지 마세요.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 공개된 근거 URL
      placeholder: https://...
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: 공개 제보 확인
      options:
        - label: 이 글은 공개되며, 개인정보·진료기록을 포함하지 않았습니다.
          required: true
